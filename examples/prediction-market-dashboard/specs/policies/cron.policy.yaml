kind: policy
name: cron
version: "0.1.0"
description: Rules governing scheduled ingestion jobs

rules:
  - id: polymarket-interval
    description: Polymarket data must be fetched every 2 minutes
    applies_to: ingest-polymarket
    condition: interval_minutes == 2
    action: trigger-flow

  - id: kalshi-interval
    description: Kalshi data must be fetched every 2 minutes
    applies_to: ingest-kalshi
    condition: interval_minutes == 2
    action: trigger-flow

  - id: cron-auth
    description: Cron routes must validate a secret token before executing
    applies_to: /api/cron/*
    condition: request.headers.x-cron-secret matches CRON_SECRET
    action: allow
