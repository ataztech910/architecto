kind: policy
name: public-api
version: "0.1.0"
description: Access and authentication rules for API routes

rules:
  - id: markets-read-public
    description: GET /api/markets is publicly accessible (no auth required)
    applies_to: GET /api/markets
    condition: any
    action: allow

  - id: market-detail-public
    description: GET /api/markets/[slug] is publicly accessible
    applies_to: GET /api/markets/[slug]
    condition: any
    action: allow

  - id: history-public
    description: GET /api/markets/[slug]/history is publicly accessible
    applies_to: GET /api/markets/[slug]/history
    condition: any
    action: allow

  - id: watchlist-auth
    description: Watchlist and settings routes require authentication
    applies_to: /api/watchlist/*
    condition: request.user is authenticated
    action: allow

  - id: settings-auth
    description: User settings routes require authentication
    applies_to: /api/settings/*
    condition: request.user is authenticated
    action: allow
