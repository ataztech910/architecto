kind: flow
name: ingest-polymarket
version: "0.1.0"
description: Fetch market data and prices from Polymarket API and upsert into database

inputs:
  - api_base_url

outputs:
  - ingested_count

steps:
  - id: fetch-markets
    action: http.get
    requires:
      - api_base_url
    provides:
      - raw_markets
    critical: true
    onError: fail

  - id: transform-markets
    action: transform.normalize
    requires:
      - raw_markets
    provides:
      - normalized_markets
    critical: true
    onError: fail

  - id: upsert-market-records
    action: db.upsert
    requires:
      - normalized_markets
    critical: true
    onError: fail

  - id: upsert-platform-records
    action: db.upsert
    requires:
      - normalized_markets
    provides:
      - platform_record_ids
    critical: true
    onError: fail

  - id: record-price-history
    action: db.insert
    requires:
      - platform_record_ids
      - normalized_markets
    provides:
      - ingested_count
    critical: true
    onError: fail
