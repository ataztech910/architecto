kind: flow
name: load-homepage
version: "0.1.0"
description: Load data for the homepage — Top Movers and All Events table

inputs: []

outputs:
  - top_movers
  - all_events

steps:
  - id: query-top-movers
    action: db.query
    provides:
      - top_movers
    critical: true
    onError: fail

  - id: query-all-events
    action: db.query
    provides:
      - all_events
    critical: true
    onError: fail
