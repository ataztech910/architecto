kind: artifact
name: market
version: "0.1.0"
description: A prediction market aggregated from multiple platforms

fields:
  - name: id
    type: uuid
    required: true
    description: Unique market ID

  - name: slug
    type: string
    required: true
    description: URL-friendly identifier

  - name: title
    type: string
    required: true
    description: Market question (e.g., "Will BTC hit $50k by EOY?")

  - name: category
    type: enum
    values:
      - elections
      - crypto
      - macro
      - sports
    required: true
    description: Market category

  - name: status
    type: enum
    values:
      - open
      - closed
      - resolved
    required: true
    description: Market status

  - name: yes_probability
    type: float
    required: true
    description: "Current YES probability (0-1)"

  - name: no_probability
    type: float
    required: true
    description: "Current NO probability (0-1)"

  - name: volume_24h
    type: float
    required: false
    description: "24-hour trading volume"

  - name: created_at
    type: timestamp
    required: true
    description: When market was created

  - name: closes_at
    type: timestamp
    required: false
    description: When market closes for trading

  - name: resolved_at
    type: timestamp
    required: false
    description: When market was resolved
