kind: artifact
name: price_history
version: "0.1.0"
description: Time-series price snapshots for a market on a given platform

fields:
  - name: id
    type: uuid
    required: true
    description: Unique record ID

  - name: market_platform_id
    type: uuid
    required: true
    references: market_platform.id
    description: Reference to market_platform record

  - name: yes_price
    type: float
    required: true
    description: "YES price at this timestamp"

  - name: no_price
    type: float
    required: true
    description: "NO price at this timestamp"

  - name: recorded_at
    type: timestamp
    required: true
    description: When this price snapshot was recorded
