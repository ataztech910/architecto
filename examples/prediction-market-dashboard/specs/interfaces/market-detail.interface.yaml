kind: interface
name: market-detail
version: "0.1.0"
description: Detailed view for a single prediction market
route: /market/[slug]

states:
  - id: loading
    description: Market detail is being loaded
  - id: loaded
    description: Full detail is displayed
  - id: not-found
    description: Market does not exist
  - id: error
    description: Failed to load detail

actions:
  - id: trade-yes
    description: User initiates a YES trade
    triggers: open-trade-modal

  - id: trade-no
    description: User initiates a NO trade
    triggers: open-trade-modal

  - id: toggle-chart-timeframe
    description: Switch between 1D, 1W, 1M chart view
    triggers: reload-chart

  - id: navigate-to-related
    description: Click a related market
    triggers: load-market-detail

components:
  - id: probability-display
    type: metric
    description: Shows current YES/NO probability and percentages

  - id: price-chart
    type: chart
    description: Historical price chart with timeframe selector

  - id: platform-comparison
    type: table
    description: Side-by-side Polymarket vs Kalshi prices and liquidity

  - id: trade-buttons
    type: action-group
    description: YES and NO trade buttons

  - id: related-events
    type: list
    description: List of related prediction markets
