kind: interface
name: homepage
version: "0.1.0"
description: Main dashboard page showing prediction markets
route: /

states:
  - id: loading
    description: Markets data is being fetched
  - id: loaded
    description: Markets are displayed
  - id: error
    description: Failed to load markets

actions:
  - id: filter-by-category
    description: User selects a category filter
    triggers: reload-events

  - id: sort-events
    description: User sorts markets table
    triggers: reload-events

  - id: navigate-to-market
    description: User clicks a market row
    triggers: load-market-detail

components:
  - id: top-movers-section
    type: section
    description: Shows top 5 markets with biggest probability change in 24h

  - id: all-events-table
    type: table
    description: Paginated table of all prediction markets

  - id: category-filter
    type: tabs
    description: Filter by elections, crypto, macro, sports
