kind: behavior
name: homepage
version: "0.1.0"
description: Acceptance scenarios for the homepage

scenarios:
  - id: shows-top-movers
    given: The database has markets with price changes in the last 24h
    when: User visits the homepage
    then: Top 5 movers are displayed sorted by 24h change descending

  - id: shows-all-events-table
    given: The database has published prediction markets
    when: User visits the homepage
    then: All markets are shown in a paginated table

  - id: filter-by-category
    given: The homepage is loaded with markets from multiple categories
    when: User selects the "elections" category filter
    then: Only markets in the elections category are shown in the table

  - id: navigate-to-market
    given: The homepage shows a market row
    when: User clicks on a market row
    then: User is navigated to the market detail page for that market

  - id: market-detail-page-loads
    given: User clicked on a market from the homepage
    when: The market detail page loads
    then: Market title, probability, and chart are visible
